<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escola que Acolhe</title>
<meta name="description" content="Experiência educativa sobre respeito, convivência, empatia e pertencimento na escola.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3B0764;
    --ink-2:#5D5070;
    --brand:#6A20A7;
    --brand-dark:#4C1474;
    --paper:#FAF9F5;
    --surface:#FFFFFF;
    --tint:#F5EDFA;
    --tint-strong:#EBDCF6;
    --line:#E6DCEE;
    --line-strong:#D6C3E4;
    --warm:#FBF1E5;
    --page:1120px;
    --read:68ch;
    --radius:18px;
    --pill:999px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:84px}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font:400 16px/1.65 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.btn,.brand,.choice-name{font-family:Montserrat,system-ui,"Segoe UI",sans-serif}
  h1{margin:0 0 14px;font-weight:800;font-size:clamp(1.85rem,4.2vw,3rem);line-height:1.1;letter-spacing:-.03em}
  h2{margin:0 0 10px;font-weight:700;font-size:clamp(1.2rem,2.2vw,1.5rem);line-height:1.28;letter-spacing:-.015em}
  h3{margin:0 0 6px;font-weight:700;font-size:1.05rem;line-height:1.3}
  p{margin:0 0 14px}
  a{color:inherit}
  button{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:6px}
  .skip{position:absolute;left:-9999px;top:12px;background:#fff;padding:10px 16px;border-radius:8px;z-index:100}
  .skip:focus{left:12px}
  .wrap{width:min(var(--page),calc(100% - 36px));margin-inline:auto}
  .site-header{background:var(--paper);border-bottom:1px solid var(--line)}
  .site-header .wrap{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:10px 0}
  .brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:.98rem;letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
  .brand svg{width:30px;height:30px;flex:none}
  .nav{display:flex;gap:6px;flex-wrap:wrap}
  .nav a{font-size:.85rem;font-weight:600;text-decoration:none;color:var(--ink-2);padding:7px 12px;border-radius:var(--pill)}
  .nav a:hover{background:var(--tint);color:var(--ink)}
  .nav a[aria-current="page"]{background:var(--tint);color:var(--brand)}
  .site-footer{margin-top:56px;border-top:1px solid var(--line);padding:22px 0 28px;color:var(--ink-2);font-size:.82rem}
  main{padding:0 0 40px}
  #app:focus{outline:none}
  .screen{max-width:100%}
  #screen.in{animation:screenIn .3s cubic-bezier(.22,.7,.3,1)}
  @keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:11px 22px;border-radius:var(--pill);
    border:1.5px solid transparent;background:var(--brand);color:#fff;font-weight:700;font-size:.92rem;text-decoration:none;cursor:pointer;
    transition:background .18s,transform .18s,box-shadow .18s}
  .btn:hover{background:var(--brand-dark)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:4px;padding-inline:6px}
  .btn.ghost:hover{color:var(--brand);background:transparent}
  .btn.small{min-height:40px;padding:8px 16px;font-size:.86rem}
  .back{display:flex;width:max-content;align-items:center;gap:7px;margin:20px 0 22px;font-size:.85rem;font-weight:600;color:var(--ink-2);text-decoration:none}
  .back:hover{color:var(--brand)}
    .lead{font-size:1.08rem;color:var(--ink-2);max-width:60ch}

  /* Home */
  body.home-route{background:#0B0618}
  body.home-route .site-header,body.home-route .site-footer{display:none}
  body.home-route main{padding:0}
  body.home-route #screen{width:100%;max-width:none}
  .home{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    padding:clamp(28px,6vh,64px) 20px;color:#FFF8F2;
    background:
      radial-gradient(ellipse 52% 38% at 24% 34%,rgba(126,42,178,.38),transparent 68%),
      radial-gradient(ellipse 46% 34% at 78% 64%,rgba(38,74,178,.34),transparent 70%),
      radial-gradient(ellipse 55% 42% at 58% 12%,rgba(92,30,142,.22),transparent 72%),
      linear-gradient(150deg,#0A0516 0%,#190832 44%,#0A1733 100%)}
  .home::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 42%,rgba(4,2,12,.72) 100%)}
  .home-sky{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .home-sky .star{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;
    background:#fff;opacity:var(--o);box-shadow:0 0 5px rgba(255,255,255,.55);
    animation:twinkle var(--tw) ease-in-out infinite;animation-delay:var(--delay)}
  .home-sky .spark{position:absolute;left:var(--x);top:var(--y);width:11px;height:11px;opacity:.8;
    background:linear-gradient(#fff,#fff) center/1px 11px no-repeat,linear-gradient(#fff,#fff) center/11px 1px no-repeat;
    filter:drop-shadow(0 0 4px rgba(255,255,255,.85));animation:sparkle 7s ease-in-out infinite;animation-delay:var(--delay)}
  .home-sky .meteor{position:absolute;left:var(--x);top:var(--y);width:var(--l);height:var(--w);border-radius:999px;
    transform:rotate(147deg);transform-origin:100% 50%;opacity:0;
    background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,190,255,.06) 24%,rgba(255,225,255,.55) 68%,#fff 100%);
    box-shadow:0 0 4px rgba(255,130,245,.3);filter:drop-shadow(0 0 3px rgba(255,150,250,.35));
    animation:meteor var(--d) linear infinite;animation-delay:var(--delay)}
  .home-sky .meteor::after{content:"";position:absolute;right:-2px;top:50%;width:max(13px,calc(var(--w) * 4));height:max(13px,calc(var(--w) * 4));
    transform:translateY(-50%);background:#fff;
    clip-path:polygon(50% 0%,61.2% 34.6%,97.6% 34.6%,68.1% 55.9%,79.4% 90.5%,50% 69%,20.6% 90.5%,31.9% 55.9%,2.4% 34.6%,38.8% 34.6%);
    box-shadow:0 0 8px 1px rgba(255,228,255,.95),0 0 20px 6px rgba(186,84,255,.5)}
  @keyframes twinkle{0%,100%{opacity:var(--o);transform:scale(1)}50%{opacity:.3;transform:scale(.72)}}
  @keyframes sparkle{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:.25;transform:scale(.7)}}
  @keyframes meteor{0%{opacity:0;transform:translate3d(0,0,0) rotate(147deg)}
    3%{opacity:var(--o)}70%{opacity:var(--o)}
    100%{opacity:0;transform:translate3d(-90vmax,60vmax,0) rotate(147deg)}}
  .home-inner{position:relative;z-index:2;width:min(700px,100%);display:flex;flex-direction:column;align-items:center;text-align:center}
  .home-brand{display:inline-flex;align-items:center;gap:8px;margin-bottom:clamp(22px,4vh,38px);
    font:700 .72rem/1 Montserrat,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#E7D6F8}
  .home-brand svg{width:17px;height:17px;flex:none}
  .home h1{margin:0;max-width:22ch;font-size:clamp(1.7rem,4.2vw,2.75rem);line-height:1.12;letter-spacing:-.035em;color:#FFF8F2;
    text-shadow:0 2px 26px rgba(6,2,14,.6),0 1px 4px rgba(6,2,14,.35)}
  .home-sub{max-width:44ch;margin:18px 0 0;color:#D9C7EC;font-size:clamp(.93rem,1.6vw,1.04rem);line-height:1.6}
  .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,4vw,32px);
    width:min(540px,100%);margin-top:clamp(28px,5vh,44px)}
  .choice{display:flex;flex-direction:column;align-items:center;gap:9px;text-decoration:none;color:#fff;border-radius:22px}
  .choice-art{display:block;width:100%;aspect-ratio:360/210;border-radius:20px;overflow:hidden;background:#F5EDFA;
    border:2px solid transparent;box-shadow:0 20px 45px -22px rgba(0,0,0,.85);
    transition:transform .25s ease,border-color .2s ease,box-shadow .25s ease}
  .choice-art svg{display:block;width:100%;height:100%}
  .choice-art img{display:block;width:100%;height:100%;object-fit:cover}
  .choice-name{font:700 clamp(.9rem,1.6vw,1.08rem)/1.25 Montserrat,system-ui,sans-serif;letter-spacing:-.01em;margin:0}
  .choice-desc{max-width:23ch;color:#D6C4EC;font-size:clamp(.78rem,1.1vw,.82rem);line-height:1.4}
  .choice:hover .choice-art,.choice:focus-visible .choice-art{border-color:#F3D27A;
    box-shadow:0 26px 50px -22px rgba(0,0,0,.9),0 0 0 4px rgba(243,210,122,.12)}
  .choice:focus-visible{outline:3px solid #F3D27A;outline-offset:6px}
  .choice:hover .choice-name{color:#F3D27A}
  .home-note{margin:clamp(24px,4vh,40px) 0 0;color:rgba(233,220,248,.78);font-size:.78rem;line-height:1.5}

  /* Intro */
  .intro{max-width:66ch;padding:8px 0 20px}
  .intro .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
  .note{font-size:.82rem;color:var(--ink-2);margin-top:14px}

  /* Progress */
  .dots{display:flex;gap:8px;align-items:center;margin:0 0 24px;font-size:.8rem;font-weight:600;color:var(--ink-2)}
  .dots span{margin-left:6px}
  .dots i{display:block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--brand)}
  .dots i.on{background:var(--brand)}

  /* Theme list */
  .feature{display:grid;gap:22px;margin:28px 0 8px;padding:20px;background:var(--surface);border:1px solid var(--line-strong);border-radius:26px}
  .feature-art{border-radius:18px;overflow:hidden;aspect-ratio:360/210;background:var(--tint)}
  .feature-art img{display:block;width:100%;height:100%;object-fit:cover}
  .feature h2{font-size:1.5rem;margin:0 0 8px}
  .feature p{color:var(--ink-2);margin:0 0 18px}
  @media (min-width:760px){.feature{grid-template-columns:minmax(0,320px) 1fr;align-items:center;padding:24px;gap:32px}}
  .themes{margin-top:8px}
  .themes + .pager{border-top:0;margin-top:12px;padding-top:0}
  .theme{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;padding:18px 4px;border-top:1px solid var(--line);cursor:pointer}
  .theme-more{display:none;grid-column:1/-1;gap:14px;padding:6px 0 4px;justify-items:start}
  .theme.open .theme-more{display:grid;animation:screenIn .25s ease-out}
  .theme-art{width:min(320px,100%);aspect-ratio:360/210;border-radius:16px;overflow:hidden;background:var(--tint)}
  .theme-art img{display:block;width:100%;height:100%;object-fit:cover}
  .theme:last-child{border-bottom:1px solid var(--line)}
  .theme:hover h2{color:var(--brand)}
  .theme h2{margin:0 0 3px;font-size:1.05rem;letter-spacing:-.01em}
  .theme p{margin:0;color:var(--ink-2);font-size:.95rem;line-height:1.5;max-width:56ch}
  .theme .mark{font-size:.85rem;font-weight:700;color:var(--brand)}
  .theme .mark.on{color:var(--ink-2);font-weight:500}

  /* Pillar */
  .pilar{display:grid;gap:30px;margin-top:28px}
  .pilar-main{min-width:0}
  .pilar-main .article{max-width:var(--read)}
  .section-block{margin-top:26px}
  .section-block:first-child{margin-top:0}
  .section-block p{color:#453257}
  .situation{margin-top:32px;padding-top:24px;border-top:1px solid var(--line);max-width:var(--read)}
  .situation h2{font-size:1.2rem;margin-bottom:8px}
  .situation .q{font-weight:700;margin:18px 0 10px;font-size:.98rem}
  .options{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .option{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;width:100%;text-align:left;padding:11px 13px;
    background:#fff;border:1.5px solid var(--line);border-radius:12px;font-size:.9rem;line-height:1.45;cursor:pointer;
    transition:border-color .16s,background .16s}
  .option:hover{border-color:var(--line-strong);background:#FDFBFE}
  .option .k{font-weight:700;font-size:.78rem;color:var(--ink-2);padding-top:2px}
  .option[aria-pressed="true"]{border-color:var(--brand);background:var(--tint);border-color:var(--brand)}
  .option[aria-pressed="true"] .k{color:var(--brand)}
  .feedback{margin-top:16px;padding-left:14px;border-left:3px solid var(--brand);font-size:.92rem;line-height:1.55}
  .feedback p{margin:0 0 8px}
  .feedback p:last-child{margin:0}
  .reflect{margin-top:32px;padding-top:22px;border-top:1px solid var(--line);max-width:var(--read);font-weight:600;font-size:1.05rem;line-height:1.5}
  .reflect h2{font-size:1.1rem;margin:0 0 10px}
  .reflect p{margin:0 0 10px;font-weight:600;font-size:1.05rem;line-height:1.5}
  .pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
  .pager .spacer{flex:1}

  /* Extra blocks */
  .extra{margin-top:28px;padding:20px;border-radius:var(--radius);background:var(--warm);max-width:var(--read)}
  .extra h2{font-size:1.1rem}
  .extra .phrase{font-size:1.02rem;font-style:italic;margin:10px 0}
  .extra ul{margin:0;padding-left:20px}
  .extra li{margin-bottom:6px}
  .phrase-box{margin-top:12px;display:grid;gap:10px}
  .suggestion{margin-top:6px;padding:12px 14px;border-left:3px solid var(--brand);background:#fff;border-radius:0 10px 10px 0;font-size:.93rem}
  .roles{display:grid;gap:10px;margin-top:14px}
  .role{padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:12px}
  .role h3{margin:0 0 3px;font-size:.95rem}
  .role p{margin:0;font-size:.88rem;color:var(--ink-2);line-height:1.5}
  @media (min-width:700px){.roles{grid-template-columns:1fr 1fr}}

  /* Quiz */
  .quiz{max-width:720px;padding-top:6px}
  .quiz-card{max-width:720px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
  .quiz-card h1{font-size:clamp(1.25rem,2.2vw,1.5rem);line-height:1.28;letter-spacing:-.015em;margin-bottom:18px}
  .quiz-actions{display:flex;gap:10px;flex-wrap:wrap}
  .quiz-actions .btn.ghost{border-color:var(--line-strong);text-decoration:none;padding-inline:22px}
  .quiz-actions .btn[aria-pressed="true"]{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
  .quiz-actions .btn.ghost[aria-pressed="true"]{background:var(--tint);border-color:var(--brand);color:var(--brand)}

  /* Apoio e fim */
  .readwrap{max-width:720px}
  .readwrap h1{max-width:20ch}
  .closing{max-width:760px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(24px,4vw,44px);margin-top:12px}
  .closing h1{font-size:clamp(1.6rem,3vw,2.2rem);max-width:22ch}
  .closing .highlight{margin:22px 0;padding-left:16px;border-left:3px solid var(--brand);font-weight:700;line-height:1.45}
  .closing .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .closing .credit{margin:24px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:.8rem;color:var(--ink-2)}
  .credits{max-width:900px}
  .credits .eyebrow{display:inline-flex;align-items:center;gap:9px;font:700 .76rem Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
  .credits .eyebrow::before{content:"";width:22px;height:1px;background:currentColor}
  .credits h1{margin:11px 0 10px;max-width:20ch}
  .creator-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:24px}
  .creator-card{overflow:hidden;display:grid;border:1px solid #E9E0ED;border-radius:22px;background:#fff;box-shadow:0 9px 26px rgba(59,7,100,.07)}
  .creator-card.mariana{border-color:#EED8CA}
  .creator-photo{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;object-position:center 30%;background:#F5E5F7}
  .creator-card.mariana .creator-photo{object-position:center 22%;background:#C88765}
  .creator-copy{padding:20px 22px 24px}
  .creator-kicker{display:block;margin-bottom:7px;color:var(--brand);font:700 .68rem/1.4 Montserrat,sans-serif;letter-spacing:.09em;text-transform:uppercase}
  .creator-card.mariana .creator-kicker{color:#A95C3C}
  .creator-copy h2{margin:0 0 8px;font:800 1.28rem Montserrat,sans-serif;letter-spacing:-.03em}
  .creator-traits{margin:0 0 10px;color:#60456F;font:700 .72rem/1.5 Montserrat,sans-serif}
  .creator-card.mariana .creator-traits{color:#97573F}
  .creator-copy p:last-child{margin:0;color:var(--ink-2);font-size:.92rem;line-height:1.55}
  @media (min-width:700px){.creator-grid{grid-template-columns:1fr 1fr;gap:18px}}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media (prefers-reduced-motion:reduce){
    *{scroll-behavior:auto !important;transition:none !important;animation:none !important}
    .home-sky .meteor{display:none}
  }
</style>
</head>
<body>
<a class="skip" href="#app">Ir para o conteúdo</a>

<header class="site-header" id="siteHeader">
  <div class="wrap">
    <a class="brand" href="#/" aria-label="Escola que Acolhe — início">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="9" fill="#F5EDFA" stroke="#E6DCEE"/>
        <path d="M16 7.5 17.9 13.1 23.5 15 17.9 16.9 16 22.5 14.1 16.9 8.5 15 14.1 13.1Z" fill="#6A20A7"/>
        <circle cx="23" cy="22.5" r="1.7" fill="#D9B241"/>
      </svg>
      <span>Escola que Acolhe</span>
    </a>
    <nav class="nav" id="nav" aria-label="Navegação principal" hidden>
      <a href="#/" data-nav="home">Início</a>
      <a href="#/estudante" data-nav="estudante">Estudantes</a>
      <a href="#/profissional" data-nav="profissional">Profissionais</a>
    </nav>
  </div>
</header>

<main id="app" class="screen" tabindex="-1"><div class="wrap" id="screen"></div></main>

<footer class="site-footer">
  <div class="wrap">Escola que Acolhe — recurso educativo. As respostas não são guardadas nem avaliadas.</div>
</footer>

<script>
/* ============ Conteúdo ============ */

const paths = {
  estudante: {
    kicker: "Caminho dos estudantes",
    introTitle: "Vamos construir uma escola onde todo mundo possa se sentir parte?",
    intro: [
      "Na escola, encontramos pessoas diferentes de nós.",
      "Conviver é aprender a respeitar essas diferenças, ouvir e perceber como nossas atitudes podem tornar o ambiente mais acolhedor.",
      "Nesta jornada, vamos explorar situações do cotidiano e descobrir pequenas atitudes que fazem diferença."
    ],
    themesTitle: "Escolha um tema para explorar",
    themesText: "Cada tema traz uma ideia, uma situação do cotidiano e uma reflexão. Explore todos ou comece pelo que mais chamar sua atenção.",
    themes: [
      "Reconhecer que cada pessoa possui características, experiências e formas de ser diferentes.",
      "Refletir sobre situações de exclusão, violência e atitudes que contribuem para uma convivência respeitosa.",
      "Aprender a expressar ideias, ouvir outras pessoas e lidar com diferenças de opinião.",
      "Compreender diferentes perspectivas e reconhecer a importância de construir relações colaborativas.",
      "Reconhecer que estudantes e profissionais contribuem para a vida escolar de diferentes maneiras."
    ],
    pillars: [
      {
        n: 1,
        name: "Respeito às diferenças",
        title: "Cada pessoa é única. E isso faz parte da convivência.",
        lead: "Reconhecer as diferenças é o primeiro passo para uma convivência em que todo mundo pode participar.",
        sections: [
          { h: "O que significa respeitar as diferenças?", ps: [
            "Cada pessoa tem sua história, opiniões e maneiras próprias de pensar, sentir e se expressar.",
            "Respeitar as diferenças é reconhecer que essas particularidades fazem parte da convivência — ninguém precisa ser igual para merecer respeito.",
            "Não precisamos concordar com tudo para tratar alguém com consideração."
          ]},
          { h: "Somos diferentes, mas temos algo em comum", ps: [
            "Mesmo quando somos diferentes, compartilhamos algo importante: todas as pessoas merecem ser tratadas com dignidade.",
            "Respeitar alguém significa considerar seus sentimentos, seus limites e seu direito de participar."
          ]}
        ],
        situation: {

function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}
function route(){
  const raw = location.hash.slice(1) || "/";
  const [p, q] = raw.split("?");
  return { parts: p.split("/").filter(Boolean), params: new URLSearchParams(q || "") };
}
function navFor(parts){
  const cur = parts[0] || "home";
  document.querySelectorAll("#nav a").forEach(a => {
    if (a.dataset.nav === cur) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  document.getElementById("nav").hidden = !parts.length;
}
function dots(flags, label){
  return `<div class="dots" >${flags.map(f => `<i class="${f ? "on" : ""}"></i>`).join("")}<span>${label}</span></div>`;
}

function homeSky(){
  let seed = 29;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const stars = [];
  for (let guard = 0; stars.length < 46 && guard < 500; guard++) {
    const x = rnd() * 100;
    const y = rnd() * 100;
    if (x > 26 && x < 74 && y > 58 && y < 88) continue;
    const s = (0.8 + rnd() * 1.7).toFixed(1);
    const o = (0.32 + rnd() * 0.55).toFixed(2);
    const tw = (4 + rnd() * 7).toFixed(1);
    const delay = -(rnd() * 9).toFixed(1);
    stars.push(`<span class="star" style="--x:${x.toFixed(2)}%;--y:${y.toFixed(2)}%;--s:${s}px;--o:${o};--tw:${tw}s;--delay:${delay}s"></span>`);
  }
  const sparks = [[18, 22, -2], [76, 17, -5], [64, 78, -3]]
    .map(([x, y, d]) => `<span class="spark" style="--x:${x}%;--y:${y}%;--delay:${d}s"></span>`).join("");
  const meteors = [
    [7, 5, 250, 2.0, 38, .72],
    [28, -7, 180, 1.6, 46, .6],
    [55, 9, 300, 2.3, 42, .8],
    [83, -3, 210, 1.8, 34, .65],
    [13, 38, 165, 1.5, 50, .55],
    [44, 47, 275, 2.1, 44, .7],
    [72, 35, 195, 1.7, 40, .6],
    [95, 57, 315, 2.4, 52, .82],
    [24, 67, 225, 1.8, 36, .65]
  ].map(([x, y, l, w, d, o], i) => {
    const delay = -(d * (0.15 + (i % 5) * 0.12)).toFixed(1);
    return `<span class="meteor" style="--x:${x}%;--y:${y}%;--l:${l}px;--w:${w}px;--d:${d}s;--delay:${delay}s;--o:${o}"></span>`;
  }).join("");
  return `<div class="home-sky" aria-hidden="true">${stars.join("")}${sparks}${meteors}</div>`;
}

function screenIntro(key){
  const p = paths[key];
  const outras = key === "estudante" ? "profissional" : "estudante";
  return `
  <a class="back" href="#/">← Início</a>
  <h1 style="max-width:24ch">${p.introTitle}</h1>
  <div class="article intro">${p.intro.slice(0, 2).map(t => `<p>${t}</p>`).join("")}</div>
  <div class="actions">
    <a class="btn" href="#/${key}/temas">Começar minha jornada</a>
    <a class="btn ghost" href="#/${outras}">Ver o caminho dos ${outras === "estudante" ? "estudantes" : "profissionais"}</a>
  </div>
  `;
}

function screenThemes(key){
  const p = paths[key];
  const flags = p.pillars.map(x => !!state.visited[key + "/" + x.n]);
  const nextIdx = flags.indexOf(false);
  const feat = nextIdx === -1 ? 0 : nextIdx;
  const f = p.pillars[feat];
  const rest = p.pillars.filter((_, i) => i !== feat).map(x => `
    <div class="theme" data-href="#/${key}/pilar/${x.n}" role="button" tabindex="0" aria-expanded="false">
      <h2>${x.name}</h2>
      <span class="mark ${flags[x.n - 1] ? "on" : ""}">${flags[x.n - 1] ? "Explorado" : "Explorar"}</span>
      <div class="theme-more">
        <div class="theme-art"><img src="assets/${themeArt[key][x.n - 1]}.png" alt=""></div>
        <p>${p.themes[x.n - 1]}</p>
        <span class="btn small">${flags[x.n - 1] ? "Reler" : "Começar"}</span>
      </div>
    </div>`).join("");
  return `
  <a class="back" href="#/${key}">← Voltar</a>
  ${dots(flags, flags.filter(Boolean).length + " de 5 explorados")}
  <h1 style="max-width:22ch">${p.themesTitle}</h1>
  <div class="feature">
    <div class="feature-art"><img src="assets/${themeArt[key][feat]}.png" alt=""></div>
    <div>
      <h2>${f.name}</h2>
      <p>${p.themes[f.n - 1]}</p>
      <a class="btn" href="#/${key}/pilar/${f.n}">${flags[feat] ? "Reler" : "Começar"}</a>
    </div>
  </div>
  <div class="themes">${rest}</div>
  <div class="pager"><span></span><a class="btn ghost" href="#/quiz">Ir para o quiz</a></div>`;
}

function renderSituation(key, pillar){
  const s = pillar.situation;
  const chosen = state.answers[key + "/" + pillar.n];
  const letters = ["A", "B", "C", "D"];
  return `
    <div class="situation" id="situacao">
      <h2>${s.title}</h2>
      <p>${s.text}</p>
      <p class="q">${s.question}</p>
      <ul class="options">
        ${s.options.map((opt, i) => `
          <li><button class="option" type="button" aria-pressed="${chosen === i}" data-answer="${i}">
            <span class="k">${letters[i]}</span><span>${esc(opt)}</span>
          </button></li>`).join("")}
      </ul>
      <div aria-live="polite">${chosen === undefined ? "" : `
        <div class="feedback" tabindex="-1">${s.feedback.slice(0, 2).map(t => `<p>${t}</p>`).join("")}</div>`}
      </div>
    </div>`;
}

function renderExtra(key, pillar){
  if (!pillar.extra) return "";
  const e = pillar.extra;
  if (e.kind === "list") {
    return `<div class="extra"><h2>${e.title}</h2><ul>${e.items.map(i => `<li>${i}</li>`).join("")}</ul></div>`;
  }
  if (e.kind === "roles") {
    return `<div class="extra"><h2>${e.title}</h2><div class="roles">${e.items.map(r => `
      <div class="role"><h3>${r.name}</h3><p>${r.desc}</p></div>`).join("")}</div></div>`;
  }
  return `
  <div class="extra">
    <h2>${e.title}</h2>
    <p>${e.instruction}</p>
    <p class="phrase">${e.original}</p>
    <div class="phrase-box">
      <div><button class="btn small" type="button" data-reveal>Ver uma reformulação</button></div>
      <div class="suggestion" hidden>${e.suggestion}</div>
    </div>
  </div>`;
}

function screenPillar(key, n){
  const p = paths[key];
  const pillar = p.pillars[n - 1];
  const prev = n > 1 ? `<a class="btn ghost" href="#/${key}/pilar/${n - 1}">← Tema anterior</a>` : `<a class="btn ghost" href="#/${key}/temas">← Temas</a>`;
  const next = n < 5
    ? `<a class="btn" href="#/${key}/pilar/${n + 1}" data-visit="${n}">Próximo tema</a>`
    : `<a class="btn" href="#/quiz" data-visit="${n}">Ir para o quiz</a>`;
  return `
  <a class="back" href="#/${key}/temas">← Temas</a>
  ${dots(p.pillars.map(x => x.n <= n), "Tema " + n + " de 5")}
  <h1 style="max-width:26ch">${pillar.title}</h1>

  <div class="pilar">
    <div class="pilar-main">
      <div class="article">
        ${pillar.sections.map(s => `<div class="section-block"><h2>${s.h}</h2>${s.ps.slice(0, 2).map(t => `<p>${t}</p>`).join("")}</div>`).join("")}
        ${renderExtra(key, pillar)}
      </div>
      ${pillar.support ? `<div class="extra" style="background:var(--tint)"><h2>${pillar.support.title}</h2>${pillar.support.ps.slice(0, 2).map(t => `<p>${t}</p>`).join("")}</div>` : ""}
      ${renderSituation(key, pillar)}
      <section class="reflect" aria-labelledby="refl-title"><h2 id="refl-title">Uma pergunta para você refletir</h2><p>${pillar.reflection}</p></section>
    </div>
    <div class="pager">
      ${prev}
      <span class="spacer"></span>
      ${next}
    </div>
  </div>`;
}

function screenQuizQuestion(n){

      <div class="quiz-actions">
        <button class="btn" type="button" data-quiz="sim" aria-pressed="${chosen === "sim"}">Sim</button>
        <button class="btn ghost" type="button" data-quiz="nao" aria-pressed="${chosen === "nao"}">Não</button>

}

/* ============ Roteador ============ */

function render(keep){
  keep = keep === "keep";
  const { parts } = route();
  const screen = document.getElementById("screen");
  let html = "";

  document.body.classList.toggle("home-route", parts.length === 0);
  document.getElementById("nav").hidden = !parts.length;
  navFor(parts);

  if (parts.length === 0) {
    html = screenHome();
  } else if (parts[0] === "estudante" || parts[0] === "profissional") {
    state.path = parts[0];
    if (parts.length === 1) html = screenIntro(parts[0]);
    else if (parts[1] === "temas") html = screenThemes(parts[0]);
    else if (parts[1] === "pilar") {
      const n = parseInt(parts[2] || "1", 10);
      if (n < 1 || n > 5) { location.hash = "#/" + parts[0] + "/temas"; return; }
      state.visited[parts[0] + "/" + n] = true;
      html = screenPillar(parts[0], n);
    } else html = screenIntro(parts[0]);
  } else if (parts[0] === "quiz") {
    if (parts[1] === "devolutiva") html = screenQuizEnd();
    else if (parts[1]) {
      const n = parseInt(parts[1], 10);
      if (n < 1 || n > quizQuestions.length) { location.hash = "#/quiz/devolutiva"; return; }
      html = screenQuizQuestion(n);
    } else html = screenQuizIntro();
  } else if (parts[0] === "apoio") {
    html = screenApoio();
  } else if (parts[0] === "fim") {
    html = screenFim();
  } else if (parts[0] === "creditos") {
    html = screenCreditos();
  } else {
    html = screenHome();
  }

  screen.innerHTML = html;
  bindScreen(parts);
  if (!keep) {
    screen.classList.remove("in");
    void screen.offsetWidth;
    screen.classList.add("in");
    window.scrollTo(0, 0);
  }
  document.getElementById("app").focus({ preventScroll: true });
}

function bindScreen(parts){
  const screen = document.getElementById("screen");

  screen.querySelectorAll(".theme[data-href]").forEach(row => {
    const act = () => {
      if (row.classList.contains("open")) { location.hash = row.dataset.href; return; }
      screen.querySelectorAll(".theme.open").forEach(o => { o.classList.remove("open"); o.setAttribute("aria-expanded", "false"); });
      row.classList.add("open"); row.setAttribute("aria-expanded", "true");
    };
    row.addEventListener("click", act);
    row.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
  });

  screen.querySelectorAll("[data-answer]").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = parts[0];
      const n = parseInt(parts[2], 10);
      state.answers[key + "/" + n] = parseInt(btn.dataset.answer, 10);
      const y = window.scrollY;
      render("keep");
      window.scrollTo(0, y);
      const fb = document.querySelector("#situacao .feedback");
      if (fb) { fb.focus({ preventScroll: true }); fb.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
    });
  });

  screen.querySelectorAll("[data-reveal]").forEach(btn => {
    btn.addEventListener("click", () => {
      const box = btn.parentElement.parentElement.querySelector(".suggestion");
      if (box) box.hidden = !box.hidden;
    });
  });

  screen.querySelectorAll("[data-visit]").forEach(link => {
    link.addEventListener("click", () => {
      const key = parts[0];
      state.visited[key + "/" + link.dataset.visit] = true;
    });
  });

  screen.querySelectorAll("[data-quiz]").forEach(btn => {
    btn.addEventListener("click", () => {
      const n = parseInt(parts[1], 10);
      state.quiz[n - 1] = btn.dataset.quiz;
      location.hash = n >= quizQuestions.length ? "#/quiz/devolutiva" : "#/quiz/" + (n + 1);
    });
  });
}

window.addEventListener("hashchange", render);
render();
</script>
